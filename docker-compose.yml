services:
  # ── Message Broker ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: younify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Gateway (Producer) ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: younify-api
    ports:
      - "3000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      redis:
        condition: service_healthy

  # ── Cluster Coordinator ────────────────────────────────────
  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: younify-coordinator
    ports:
      - "8050:8050"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy

  # ── Worker (Consumer) ──────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
